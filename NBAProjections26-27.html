<title>NBA 2026–27 roster boxes</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--line:#d9d9d2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecece8;--mut:#a3a39c;--card:#202020;--line:#3a3a36;color-scheme:dark}}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:1.2rem}
h1{font-size:1.4rem;margin:.2rem 0}
.mut{color:var(--mut);font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;margin:.8rem 0}
select,button.x{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:.3rem .6rem;font:inherit}
.leg{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.8rem}
.leg i{display:inline-block;width:.8rem;height:.8rem;border-radius:2px;margin-right:.3rem;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.8rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem;cursor:pointer;text-align:left;color:inherit;font:inherit}
.card:hover{border-color:var(--mut)}
svg{width:100%;height:auto;display:block;margin:.3rem 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;overflow:auto;padding:1rem}
.ov.on{display:block}
.pan{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:1000px;margin:0 auto;padding:1rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.2rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{padding:.25rem .4rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
</style>
</head>

function init(){
  const T=DATA.teams,by={};T.forEach(t=>by[t.abbr]=t);

  function svg(t){
    const sh=t.players.map(p=>{
      const pts=p.poly.map(q=>q[0]+','+(1-q[1]).toFixed(3)).join(' ');
      return '<g><polygon points="'+pts+'" fill="'+col(p.arch)+'" fill-opacity=".7" stroke="'+col(p.arch)+'" stroke-width=".004"><title>'+esc(p.name)+' · '+esc(lab(p.arch))+'</title></polygon>'+

  function grid(){
    const L=[...T].sort($('sort').value==='abc'?(a,b)=>a.abbr.localeCompare(b.abbr):(a,b)=>b.net-a.net);
    $('grid').innerHTML=L.map(t=>'<button class="card" data-t="'+t.abbr+'"><b>'+t.abbr+'</b> '+t.w+'–'+t.l+' <span class="mut">net '+sg(t.net)+'</span>'+svg(t)+'<div class="mut">'+t.w10+'–'+t.w90+' wins · '+Math.round(t.cov*100)+'% filled</div></button>').join('');
    $('grid').querySelectorAll('.card').forEach(b=>b.onclick=()=>{A=b.dataset.t;B='';openPanel();});
  }
  $('sort').onchange=grid;grid();
  $('ov').onclick=e=>{if(e.target.id==='ov')$('ov').classList.remove('on');};
  document.onkeydown=e=>{if(e.key==='Escape')$('ov').classList.remove('on');};
}
</script>
</body>
</html>
